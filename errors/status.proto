syntax = "proto3";

package corex.errors;

option go_package = "github.com/nexuer/corex/errors;errors";

import "google/protobuf/descriptor.proto";

message Status {
  int32 code = 1;
  string reason = 2;
  string message = 3;
  map<string, string> metadata = 4;
};

extend google.protobuf.EnumOptions {
  int32 default_code = 2108;
}

extend google.protobuf.EnumValueOptions {
  int32 code = 2109;
}